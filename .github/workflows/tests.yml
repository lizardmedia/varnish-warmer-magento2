name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: PHP ${{ matrix.php }}, Magento ${{ matrix.magento }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            magento: '2.4.6-p15'
          - php: '8.2'
            magento: '2.4.6-p15'
          - php: '8.3'
            magento: '2.4.7-p10'
          - php: '8.4'
            magento: '2.4.9'
          - php: '8.5'
            magento: '2.4.9'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, gd, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sodium, xsl, zip
          coverage: none

      - name: Install Magento packages from the Mage-OS mirror, so pull requests from forks need no repo.magento.com keys
        run: sed -i 's#https://repo.magento.com/#https://mirror.mage-os.org/#' composer.json

      - name: Pin all Magento packages to the release projects run, including its known advisories
        run: |
          composer config policy.advisories.block false
          composer config audit.block-insecure false
          composer require --no-update --no-interaction magento/product-community-edition:${{ matrix.magento }}

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpunit
